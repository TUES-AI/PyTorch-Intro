<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>PyTorch Intro Leaderboard</title>
  <style>
    body {
      margin: 0;
      font-family: system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
      background: #ffffff;
      color: #111827;
    }
    main {
      width: min(920px, calc(100% - 32px));
      margin: 0 auto;
      padding: 36px 0 56px;
    }
    .hero {
      padding: 24px 0 18px;
      border-bottom: 1px solid #e5e7eb;
    }
    h1 {
      margin: 0 0 10px;
      font-size: clamp(2rem, 5vw, 3.5rem);
      line-height: 1;
      letter-spacing: -0.05em;
    }
    h1 a { color: inherit; text-decoration: none; }
    h1 a:hover { text-decoration: underline; }
    p { color: #4b5563; }
    code {
      background: #f3f4f6;
      padding: 0.15rem 0.35rem;
      border-radius: 0.35rem;
    }
    .status {
      display: inline-flex;
      align-items: center;
      gap: 8px;
      margin-top: 8px;
      padding: 7px 11px;
      border-radius: 999px;
      background: #f9fafb;
      border: 1px solid #e5e7eb;
      font-weight: 700;
      color: #374151;
    }
    .dot { width: 9px; height: 9px; border-radius: 999px; background: #f59e0b; }
    .online .dot { background: #22c55e; }
    .offline .dot { background: #f97316; }
    .error .dot { background: #ef4444; }
    .panel { margin-top: 26px; }
    .board { display: grid; gap: 8px; }
    .entry { border-bottom: 1px solid #f1f5f9; }
    .row {
      display: grid;
      grid-template-columns: 48px minmax(130px, 1fr) minmax(180px, 2fr) 92px;
      gap: 14px;
      align-items: center;
      padding: 13px 0;
    }
    .run-list {
      display: none;
      margin: 0 0 8px 48px;
      padding-left: 14px;
      border-left: 2px solid #e5e7eb;
    }
    .entry.open .run-list { display: block; }
    .run-row {
      padding: 8px 0;
      color: #4b5563;
      font-size: 0.94rem;
    }
    .rank { font-weight: 900; font-size: 1.1rem; color: #6b7280; }
    .name {
      font-weight: 800;
      overflow: hidden;
      text-overflow: ellipsis;
      white-space: nowrap;
    }
    .name-line { display: inline-flex; align-items: center; gap: 7px; min-width: 0; }
    .name-text { overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
    .run-count { color: #6b7280; font-weight: 600; }
    .winner-badge { color: #b45309; font-weight: 900; }
    .toggle {
      width: 22px;
      height: 22px;
      border: 1px solid #d1d5db;
      border-radius: 999px;
      background: #ffffff;
      color: #374151;
      cursor: pointer;
      line-height: 18px;
      padding: 0;
      font-weight: 900;
    }
    .toggle:hover { background: #f9fafb; }
    .toggle-spacer { display: inline-block; width: 22px; }
    .bar-wrap { height: 16px; border-radius: 999px; overflow: hidden; background: #eef2f7; }
    .bar { height: 100%; border-radius: inherit; width: 0; min-width: 3px; transition: width 0.7s ease; }
    .score { text-align: right; font-variant-numeric: tabular-nums; font-weight: 900; }
    .muted { color: #6b7280; }
    @media (max-width: 720px) {
      .row { grid-template-columns: 38px 1fr 76px; }
      .bar-wrap { grid-column: 2 / 4; }
      .run-list { margin-left: 38px; }
    }
  </style>
</head>
<body>
  <main>
    <section class="hero">
      <h1><a href="https://github.com/TUES-AI/PyTorch-Intro">PyTorch Intro Leaderboard</a></h1>
      <p>FashionMNIST robustness challenge final results. The live scoring server is offline; this page keeps the archived leaderboard.</p>
      <div id="status" class="status"><span class="dot"></span><span>Loading archived leaderboard...</span></div>
    </section>

    <section class="panel">
      <h2>Leaderboard</h2>
      <div id="board" class="board"><p class="muted">Loading...</p></div>
    </section>
  </main>

  <script>
    const statusEl = document.getElementById("status");
    const boardEl = document.getElementById("board");

    function setStatus(kind, text) {
      statusEl.className = "status " + kind;
      statusEl.querySelector("span:last-child").textContent = text;
    }

    function fallbackGradient(name) {
      let hash = 0;
      for (let i = 0; i < name.length; i++) hash = ((hash << 5) - hash + name.charCodeAt(i)) | 0;
      const hue = Math.abs(hash) % 360;
      return `linear-gradient(90deg, hsl(${hue}, 75%, 52%), hsl(${(hue + 42) % 360}, 75%, 62%))`;
    }

    function escapeHtml(value) {
      return String(value).replace(/[&<>'"]/g, char => ({"&":"&amp;","<":"&lt;",">":"&gt;","'":"&#39;","\"":"&quot;"}[char]));
    }

    function rowHtml(row, index, isRun=false) {
      const rank = isRun ? (row.run_rank || index + 1) : (row.rank || index + 1);
      const rankText = isRun ? `${rank}.` : `#${rank}`;
      const percent = Math.max(0, Math.min(100, row.accuracy * 100));
      const gradient = row.gradient || fallbackGradient(row.name);
      const safeName = escapeHtml(row.name);
      const nameStyle = row.name_color ? ` style="color:${escapeHtml(row.name_color)}"` : "";
      const winnerBadge = row.winner ? `<span class="winner-badge">🏆 winner</span>` : "";
      const hasRuns = !isRun && row.runs && row.runs.length;
      const toggle = hasRuns ? `<button class="toggle" type="button" aria-label="show runs">▸</button>` : `<span class="toggle-spacer"></span>`;
      const runCount = hasRuns ? `<span class="run-count">(${row.runs.length} runs)</span>` : "";
      return `
        <div class="row ${isRun ? "run-row" : ""}">
          <div class="rank">${rankText}</div>
          <div class="name" title="${safeName}">
            <span class="name-line">${toggle}<span class="name-text"${nameStyle}>${safeName}</span>${winnerBadge}${runCount}</span>
          </div>
          <div class="bar-wrap"><div class="bar" style="width:${percent.toFixed(2)}%; background:${gradient}"></div></div>
          <div class="score">${percent.toFixed(2)}%</div>
        </div>`;
    }

    function renderLeaderboard(rows) {
      if (!rows.length) {
        boardEl.innerHTML = `<p class="muted">No submissions yet.</p>`;
        return;
      }
      boardEl.innerHTML = rows.map((row, index) => {
        const runList = row.runs && row.runs.length
          ? `<div class="run-list">${row.runs.map((run, runIndex) => rowHtml(run, runIndex, true)).join("")}</div>`
          : "";
        return `<div class="entry">${rowHtml(row, index)}${runList}</div>`;
      }).join("");

      boardEl.querySelectorAll(".toggle").forEach(button => {
        button.addEventListener("click", () => {
          const entry = button.closest(".entry");
          const opened = entry.classList.toggle("open");
          button.textContent = opened ? "▾" : "▸";
          button.setAttribute("aria-label", opened ? "hide runs" : "show runs");
        });
      });
    }

    async function loadArchive(text="Archived final leaderboard") {
      const data = await fetch("leaderboard-archive.json?ts=" + Date.now(), {cache: "no-store"}).then(r => r.json());
      setStatus("offline", text);
      renderLeaderboard(data.leaderboard || []);
    }

    async function main() {
      const current = await fetch("server-url/current.txt?ts=" + Date.now(), {cache: "no-store"}).then(r => r.text()).catch(() => "");
      const serverUrl = current.trim();
      if (!serverUrl) {
        await loadArchive();
        return;
      }
      setStatus("online", "Backend online");
      try {
        const data = await fetch(serverUrl + "/api/leaderboard?ts=" + Date.now(), {cache: "no-store"}).then(r => r.json());
        renderLeaderboard(data.leaderboard || []);
      } catch (_) {
        await loadArchive("Archived final leaderboard");
      }
    }

    main().catch(error => {
      setStatus("error", "Could not load archived leaderboard");
      boardEl.innerHTML = `<p class="muted">${escapeHtml(error.message)}</p>`;
    });
  </script>
</body>
</html>
